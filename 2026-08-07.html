<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skill-radar · 近 90 天新星榜 · 2026-08-07</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", -apple-system, "Segoe UI", system-ui, sans-serif;
           background: #f5f6f7; color: #1d2129; font-size: 14px; }
    .shell { display: flex; min-height: 100vh; }
    aside { width: 216px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e6eb; padding: 18px 14px; }
    aside h1 { font-size: 16px; margin: 0 0 2px; }
    aside .sub { color: #86909c; font-size: 12px; margin: 0 0 18px; }
    aside .group { color: #86909c; font-size: 12px; margin: 18px 0 6px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
                cursor: pointer; user-select: none; }
    .nav-item:hover { background: #f2f3f5; }
    .nav-item.active { background: rgba(51,112,255,.10); color: #3370ff; font-weight: 600; }
    .nav-item .n { margin-left: auto; font-size: 12px; background: #f2f3f5; color: #4e5969;
                   border-radius: 10px; padding: 0 7px; }
    .nav-item.active .n { background: rgba(51,112,255,.18); color: #3370ff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.持续更新 { background: #00b42a; }
    .dot.轻量维护 { background: #ff7d00; }
    .dot.停更 { background: #c9cdd4; }
    main { flex: 1; min-width: 0; padding: 20px 24px 32px; }
    .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .head h2 { font-size: 20px; margin: 0; }
    .head .meta { color: #86909c; font-size: 13px; }
    .head a { color: #3370ff; text-decoration: none; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; padding: 12px 16px; }
    .stat .v { font-size: 22px; font-weight: 600; }
    .stat .k { color: #86909c; font-size: 12px; margin-top: 2px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    input, select { font: inherit; border: 1px solid #e5e6eb; border-radius: 6px; padding: 6px 10px;
                    background: #fff; color: inherit; outline-color: #3370ff; }
    input#search { width: 280px; }
    .table-wrap { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f2f3f5; vertical-align: top; }
    th { background: #f7f8fa; font-weight: 500; color: #4e5969; white-space: nowrap; position: sticky; top: 0; }
    th.s { cursor: pointer; }
    th.s:hover { color: #3370ff; }
    th.c-idx { width: 46px; }
    th.c-name { width: 210px; }
    th.c-cat { width: 118px; }
    th.c-lang { width: 96px; }
    th.c-num { width: 92px; }
    th.c-date { width: 122px; }
    tbody tr:hover { background: #fafbfc; }
    td.name { min-width: 176px; overflow-wrap: break-word; }
    td.name a { color: #1d2129; text-decoration: none; font-weight: 600; }
    td.name a:hover { color: #3370ff; text-decoration: underline; }
    td.desc { min-width: 250px; color: #4e5969; line-height: 1.55; }
    td.desc .orig { color: #a9aeb8; font-size: 12px; margin-top: 3px; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .delta { color: #b45309; font-weight: 600; }
    .pill { display: inline-block; background: #f0f2ff; color: #3370ff; border-radius: 4px;
            padding: 1px 8px; font-size: 12px; white-space: nowrap; margin: 0 4px 3px 0; }
    .pill.domain { background: #f0f9f0; color: #009a29; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .tags span { background: #f2f3f5; color: #86909c; border-radius: 4px; padding: 1px 6px;
                 font-size: 12px; white-space: nowrap; font-weight: 400; }
    .state { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: #4e5969; font-size: 12px; }
    .none { padding: 28px; color: #86909c; text-align: center; }

    @media (max-width: 760px) {
      .shell { flex-direction: column; }
      aside { width: auto; border-right: none; border-bottom: 1px solid #e5e6eb; padding: 14px 12px; }
      aside .group { margin: 12px 0 6px; }
      #shapes, #domains, #maintenance { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
      #shapes .nav-item, #domains .nav-item, #maintenance .nav-item { white-space: nowrap; background: #f7f8fa; }
      #shapes .nav-item.active, #domains .nav-item.active, #maintenance .nav-item.active { background: rgba(51,112,255,.12); }
      main { padding: 14px 12px 28px; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { padding: 10px 12px; }
      .stat .v { font-size: 18px; }
      .toolbar { gap: 8px; }
      input#search, select { width: 100%; }
      .table-wrap { border: none; background: transparent; overflow-x: visible; }
      table { min-width: 0; }
      thead { display: none; }
      tbody, tr, td { display: block; }
      tr { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px;
           padding: 12px 14px; margin-bottom: 10px; }
      tbody tr:hover { background: #fff; }
      td { border: none; padding: 3px 0; text-align: left !important; }
      td.num { text-align: left; }
      td:first-child { display: none; }
      td.name { min-width: 0; font-size: 15px; }
      td.desc { min-width: 0; padding: 6px 0 8px; }
      td[data-label]::before { content: attr(data-label) "："; color: #a9aeb8; font-size: 12px; }
      td[data-label] { display: inline-block; margin-right: 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>skill-radar</h1>
      <p class="sub">GitHub Claude skills 日榜</p>
      <p class="group">形态</p>
      <div id="shapes"></div>
      <p class="group">领域</p>
      <div id="domains"></div>
      <p class="group">维护状态</p>
      <div id="maintenance"></div>
    </aside>
    <main>
      <div class="head">
        <h2>近 90 天新星榜</h2>
        <span class="meta">2026-08-07 · <span id="count"></span></span>
        <span class="meta"><a href="index.html">全部日期</a></span>
      </div>
      <div class="stats">
        <div class="stat"><div class="v">1</div><div class="k">今日上榜</div></div>
        <div class="stat"><div class="v">1</div><div class="k">在库仓库</div></div>
        <div class="stat"><div class="v">500</div><div class="k">在库总 Star</div></div>
        <div class="stat"><div class="v">+0</div><div class="k">今日增星合计</div></div>
      </div>
      <div class="toolbar">
        <input id="search" type="text" placeholder="搜索仓库名、说明、语言、标签…">
        <select id="scope">
          <option value="board">今日上榜 1 个</option>
          <option value="all">全部在库 1 个</option>
        </select>
        <select id="sort">
          <option value="delta:desc">今日增星 高→低</option>
          <option value="stars:desc">总 Star 高→低</option>
          <option value="forks:desc">Fork 高→低</option>
          <option value="pushed_at:desc">最近更新</option>
          <option value="full_name:asc">名称 A→Z</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num c-idx">#</th>
              <th class="s c-name" data-key="full_name">仓库</th>
              <th>说明</th>
              <th class="c-cat">形态 · 领域</th>
              <th class="c-lang">语言</th>
              <th class="s num c-num" data-key="stars">总 Star</th>
              <th class="s num c-num" data-key="delta">今日增星</th>
              <th class="s num c-num" data-key="forks">Fork</th>
              <th class="s c-date" data-key="pushed_at">最近更新</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="none" id="none" style="display:none">没有符合条件的项目。</div>
      </div>
    </main>
  </div>
  <script id="board-data" type="application/json">[{"full_name": "a/x", "url": "https://github.com/a/x", "description": "说明", "zh": "", "shape": "单个技能", "domain": "通用", "language": "", "stars": 500, "delta": null, "forks": 0, "pushed_at": "2026-08-05", "maintenance": "持续更新", "topics": ["claude-skills"]}]</script>
  <script id="all-data" type="application/json">[{"full_name": "a/x", "url": "https://github.com/a/x", "description": "说明", "zh": "", "shape": "单个技能", "domain": "通用", "language": "", "stars": 500, "delta": null, "forks": 0, "pushed_at": "2026-08-05", "maintenance": "持续更新", "topics": ["claude-skills"]}]</script>
  <script>

const DATA = {
  board: JSON.parse(document.getElementById('board-data').textContent),
  all: JSON.parse(document.getElementById('all-data').textContent),
};
const SHAPES = ["技能集合", "基建", "Agent框架", "模板脚手架", "单个技能"];
const DOMAINS = ["写作", "设计", "PPT演示", "文档处理", "数据分析", "编程开发", "科研学术", "营销运营", "教育学习", "生活效率", "安全", "运维部署", "金融法务", "通用"];
const STATES = ['持续更新', '轻量维护', '停更'];
const state = { scope: 'board', shape: '', domain: '', maintenance: '', query: '', sort: 'delta', desc: true };

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

// 窄屏没有表头，每格自带列名，靠 CSS 的 ::before 显示。
const labelled = (tag, cls, text, label) => {
  const node = el(tag, cls, text);
  node.setAttribute('data-label', label);
  return node;
};

function scoped() { return DATA[state.scope]; }

function matches(row) {
  if (state.shape && row.shape !== state.shape) return false;
  if (state.domain && row.domain !== state.domain) return false;
  if (state.maintenance && row.maintenance !== state.maintenance) return false;
  if (state.query) {
    const hay = [row.full_name, row.description, row.zh, row.language,
                 row.shape, row.domain, row.topics.join(' ')]
      .join(' ').toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

function sorted(rows) {
  const key = state.sort;
  const copy = rows.slice();
  copy.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'delta' || key === 'stars' || key === 'forks') {
      av = av === null ? -1 : av; bv = bv === null ? -1 : bv;
      return state.desc ? bv - av : av - bv;
    }
    av = String(av || ''); bv = String(bv || '');
    return state.desc ? bv.localeCompare(av) : av.localeCompare(bv);
  });
  return copy;
}

function buildGroup(id, key, allLabel, values) {
  const rows = scoped();
  const box = document.getElementById(id);
  box.textContent = '';
  const entries = [['', allLabel, rows.length]].concat(
    values
      .map(v => [v, v, rows.filter(r => r[key] === v).length])
      .filter(([, , count]) => count > 0 || state[key] !== '')
  );
  for (const [value, label, count] of entries) {
    const item = el('div', 'nav-item' + (state[key] === value ? ' active' : ''));
    item.appendChild(el('span', null, label));
    item.appendChild(el('span', 'n', String(count)));
    item.onclick = () => { state[key] = value; render(); };
    box.appendChild(item);
  }
}

function buildSidebar() {
  const rows = scoped();
  buildGroup('shapes', 'shape', '全部形态', SHAPES);
  buildGroup('domains', 'domain', '全部领域', DOMAINS);

  const states = document.getElementById('maintenance');
  states.textContent = '';
  const stateEntries = [['', '全部状态']].concat(STATES.map(s => [s, s]));
  for (const [value, label] of stateEntries) {
    const item = el('div', 'nav-item' + (state.maintenance === value ? ' active' : ''));
    if (value) item.appendChild(el('span', 'dot ' + value));
    item.appendChild(el('span', null, label));
    if (value) item.appendChild(el('span', 'n', String(rows.filter(r => r.maintenance === value).length)));
    item.onclick = () => { state.maintenance = value; render(); };
    states.appendChild(item);
  }
}

function rowNode(row, index) {
  const tr = el('tr');
  tr.appendChild(el('td', 'num', String(index + 1)));

  const name = el('td', 'name');
  const link = el('a', null, row.full_name);
  link.href = row.url; link.target = '_blank'; link.rel = 'noreferrer';
  name.appendChild(link);
  if (row.topics.length) {
    const tagBox = el('div', 'tags');
    for (const topic of row.topics.slice(0, 3)) tagBox.appendChild(el('span', null, topic));
    name.appendChild(tagBox);
  }
  tr.appendChild(name);

  const desc = el('td', 'desc');
  desc.appendChild(el('div', null, row.zh || row.description || '（无说明）'));
  if (row.zh && row.description) desc.appendChild(el('div', 'orig', row.description));
  tr.appendChild(desc);

  const cat = el('td');
  cat.setAttribute('data-label', '分类');
  cat.appendChild(el('span', 'pill', row.shape));
  cat.appendChild(el('span', 'pill domain', row.domain));
  tr.appendChild(cat);

  tr.appendChild(labelled('td', null, row.language || '—', '语言'));
  tr.appendChild(labelled('td', 'num', row.stars.toLocaleString(), '总 Star'));

  const delta = labelled('td', 'num', undefined, '今日增星');
  if (row.delta === null) delta.textContent = '—';
  else delta.appendChild(el('span', 'delta', '+' + row.delta));
  tr.appendChild(delta);

  tr.appendChild(labelled('td', 'num', row.forks.toLocaleString(), 'Fork'));

  const st = el('td');
  st.setAttribute('data-label', '最近更新');
  const wrap = el('div', 'state');
  wrap.appendChild(el('span', 'dot ' + row.maintenance));
  wrap.appendChild(el('span', null, row.pushed_at));
  st.appendChild(wrap);
  tr.appendChild(st);
  return tr;
}

function render() {
  buildSidebar();
  const rows = sorted(scoped().filter(matches));
  const body = document.getElementById('rows');
  body.textContent = '';
  rows.forEach((row, i) => body.appendChild(rowNode(row, i)));
  document.getElementById('count').textContent = rows.length + ' 条';
  document.getElementById('none').style.display = rows.length ? 'none' : 'block';
}

document.getElementById('search').oninput = (e) => {
  state.query = e.target.value.trim().toLowerCase(); render();
};
document.getElementById('scope').onchange = (e) => { state.scope = e.target.value; render(); };
document.getElementById('sort').onchange = (e) => {
  const [key, dir] = e.target.value.split(':');
  state.sort = key; state.desc = dir === 'desc'; render();
};
document.querySelectorAll('th.s').forEach(th => {
  th.onclick = () => {
    const key = th.dataset.key;
    state.desc = state.sort === key ? !state.desc : true;
    state.sort = key;
    render();
  };
});
render();

  </script>
</body>
</html>
