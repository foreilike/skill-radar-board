  <script>

const DATA = {
  board: JSON.parse(document.getElementById('board-data').textContent),
  all: JSON.parse(document.getElementById('all-data').textContent),
};
const SHAPES = ["技能集合", "基建", "Agent框架", "模板脚手架", "单个技能"];
const DOMAINS = ["写作", "设计", "PPT演示", "文档处理", "数据分析", "编程开发", "科研学术", "营销运营", "教育学习", "生活效率", "安全", "运维部署", "金融法务", "通用"];
const STATES = ['持续更新', '轻量维护', '停更'];
const state = { scope: 'board', shape: '', domain: '', maintenance: '', query: '', sort: 'delta', desc: true };

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

// 窄屏没有表头，每格自带列名，靠 CSS 的 ::before 显示。
const labelled = (tag, cls, text, label) => {
  const node = el(tag, cls, text);
  node.setAttribute('data-label', label);
  return node;
};

function scoped() { return DATA[state.scope]; }

function matches(row) {
  if (state.shape && row.shape !== state.shape) return false;
  if (state.domain && row.domain !== state.domain) return false;
  if (state.maintenance && row.maintenance !== state.maintenance) return false;
  if (state.query) {
    const hay = [row.full_name, row.description, row.zh, row.language,
                 row.shape, row.domain, row.topics.join(' ')]
      .join(' ').toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

function sorted(rows) {
  const key = state.sort;
  const copy = rows.slice();
  copy.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'delta' || key === 'stars' || key === 'forks') {
      av = av === null ? -1 : av; bv = bv === null ? -1 : bv;
      return state.desc ? bv - av : av - bv;
    }
    av = String(av || ''); bv = String(bv || '');
    return state.desc ? bv.localeCompare(av) : av.localeCompare(bv);
  });
  return copy;
}

function buildGroup(id, key, allLabel, values) {
  const rows = scoped();
  const box = document.getElementById(id);
  box.textContent = '';
  const entries = [['', allLabel, rows.length]].concat(
    values
      .map(v => [v, v, rows.filter(r => r[key] === v).length])
      .filter(([, , count]) => count > 0 || state[key] !== '')
  );
  for (const [value, label, count] of entries) {
    const item = el('div', 'nav-item' + (state[key] === value ? ' active' : ''));
    item.appendChild(el('span', null, label));
    item.appendChild(el('span', 'n', String(count)));
    item.onclick = () => { state[key] = value; render(); };
    box.appendChild(item);
  }
}

function buildSidebar() {
  const rows = scoped();
  buildGroup('shapes', 'shape', '全部形态', SHAPES);
  buildGroup('domains', 'domain', '全部领域', DOMAINS);

  const states = document.getElementById('maintenance');
  states.textContent = '';
  const stateEntries = [['', '全部状态']].concat(STATES.map(s => [s, s]));
  for (const [value, label] of stateEntries) {
    const item = el('div', 'nav-item' + (state.maintenance === value ? ' active' : ''));
    if (value) item.appendChild(el('span', 'dot ' + value));
    item.appendChild(el('span', null, label));
    if (value) item.appendChild(el('span', 'n', String(rows.filter(r => r.maintenance === value).length)));
    item.onclick = () => { state.maintenance = value; render(); };
    states.appendChild(item);
  }
}

function rowNode(row, index) {
  const tr = el('tr');
  tr.appendChild(el('td', 'num', String(index + 1)));

  const name = el('td', 'name');
  const link = el('a', null, row.full_name);
  link.href = row.url; link.target = '_blank'; link.rel = 'noreferrer';
  name.appendChild(link);
  if (row.topics.length) {
    const tagBox = el('div', 'tags');
    for (const topic of row.topics.slice(0, 3)) tagBox.appendChild(el('span', null, topic));
    name.appendChild(tagBox);
  }
  tr.appendChild(name);

  const desc = el('td', 'desc');
  desc.appendChild(el('div', null, row.zh || row.description || '（无说明）'));
  if (row.zh && row.description) desc.appendChild(el('div', 'orig', row.description));
  tr.appendChild(desc);

  const cat = el('td');
  cat.setAttribute('data-label', '分类');
  cat.appendChild(el('span', 'pill', row.shape));
  cat.appendChild(el('span', 'pill domain', row.domain));
  tr.appendChild(cat);

  tr.appendChild(labelled('td', null, row.language || '—', '语言'));
  tr.appendChild(labelled('td', 'num', row.stars.toLocaleString(), '总 Star'));

  const delta = labelled('td', 'num', undefined, '今日增星');
  if (row.delta === null) delta.textContent = '—';
  else delta.appendChild(el('span', 'delta', '+' + row.delta));
  tr.appendChild(delta);

  tr.appendChild(labelled('td', 'num', row.forks.toLocaleString(), 'Fork'));

  const st = el('td');
  st.setAttribute('data-label', '最近更新');
  const wrap = el('div', 'state');
  wrap.appendChild(el('span', 'dot ' + row.maintenance));
  wrap.appendChild(el('span', null, row.pushed_at));
  st.appendChild(wrap);
  tr.appendChild(st);
  return tr;
}

function render() {
  buildSidebar();
  const rows = sorted(scoped().filter(matches));
  const body = document.getElementById('rows');
  body.textContent = '';
  rows.forEach((row, i) => body.appendChild(rowNode(row, i)));
  document.getElementById('count').textContent = rows.length + ' 条';
  document.getElementById('none').style.display = rows.length ? 'none' : 'block';
}

document.getElementById('search').oninput = (e) => {
  state.query = e.target.value.trim().toLowerCase(); render();
};
document.getElementById('scope').onchange = (e) => { state.scope = e.target.value; render(); };
document.getElementById('sort').onchange = (e) => {
  const [key, dir] = e.target.value.split(':');
  state.sort = key; state.desc = dir === 'desc'; render();
};
document.querySelectorAll('th.s').forEach(th => {
  th.onclick = () => {
    const key = th.dataset.key;
    state.desc = state.sort === key ? !state.desc : true;
    state.sort = key;
    render();
  };
});
render();

  </script>
</body>
</html>
